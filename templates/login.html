{% extends 'base.html' %}

{% block title %}Sign In – SafeHer Safety Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="safeher-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="fa-solid fa-shield-heart"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Welcome to SafeHer</h3>
                    <p class="text-white-50 small">Sign in to manage your emergency contacts and safety hub</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label text-white-50 small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" required placeholder="name@example.com" value="{{ email or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-white-50 small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-4">
                        <button type="submit" class="btn btn-primary rounded-pill fw-bold py-2">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to SafeHer
                        </button>
                    </div>
                </form>

                <!-- 1-Click Demo Login Fillers -->
                <div class="card bg-dark border-secondary p-3 mb-3">
                    <div class="small text-white-50 fw-semibold mb-2"><i class="fa-solid fa-wand-magic-sparkles text-warning me-1"></i> Quick Demo Auto-Fill:</div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-info flex-grow-1" onclick="autoFillDemo('priya@safeher.com', 'user123')">
                            <i class="fa-solid fa-user"></i> Demo User
                        </button>
                        <button class="btn btn-sm btn-outline-warning flex-grow-1" onclick="autoFillDemo('admin@safeher.com', 'admin123')">
                            <i class="fa-solid fa-shield"></i> Admin
                        </button>
                    </div>
                </div>

                <div class="text-center text-white-50 small">
                    Don't have an account? 
                    <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-bold">Sign up now</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function autoFillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
